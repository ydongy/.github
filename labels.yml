# Labels for repositories owned by ydongy. Apply with scripts/sync-labels.sh.
# Two groups. `common` is for every repository and is the default. `product` is only for closed product
# repositories that follow the handbook (handbook/core/process.md) and is applied with `--product`.
# Scope labels are per repository and are never created or removed by the sync.
common:
  - name: bug
    color: "D73A4A"
    description: Something is not working
  - name: enhancement
    color: "A2EEEF"
    description: New feature or request
  - name: documentation
    color: "0075CA"
    description: Improvements or additions to documentation
  - name: question
    color: "D876E3"
    description: Further information is requested
  - name: good first issue
    color: "7057FF"
    description: Good for newcomers
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
  - name: dependencies
    color: "0366D6"
    description: Dependency updates
  - name: duplicate
    color: "CFD3D7"
    description: This issue or pull request already exists
  - name: invalid
    color: "E4E669"
    description: This does not seem right
  - name: wontfix
    color: "FFFFFF"
    description: This will not be worked on

# Type labels mirror commit types (handbook/core/process.md).
product:
  - name: feat
    color: "1D76DB"
    description: New feature
  - name: fix
    color: "D73A4A"
    description: Bug fix
  - name: design
    color: "C5DEF5"
    description: Mockups, icons, design tokens
  - name: docs
    color: "0075CA"
    description: Documentation only
  - name: refactor
    color: "FBCA04"
    description: Behaviour-preserving change
  - name: test
    color: "BFD4F2"
    description: Tests only
  - name: perf
    color: "F9D0C4"
    description: Performance
  - name: build
    color: "E4E669"
    description: Project config, dependencies, signing
  - name: ci
    color: "EDEDED"
    description: CI configuration
  - name: chore
    color: "FEF2C0"
    description: Everything else
  - name: security
    color: "B60205"
    description: Needs a security walkthrough
  - name: milestone
    color: "5319E7"
    description: Tracking issue for a milestone
  - name: needs-decision
    color: "E99695"
    description: Waiting for the maintainer's call
  - name: unverified
    color: "D4C5F9"
    description: Technical assumption not yet measured
  - name: no-changelog
    color: "EDEDED"
    description: A fix/feat PR that needs no changelog line
  - name: design-unchanged
    color: "EDEDED"
    description: UI code changed but the screen design did not
